<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Helene's Candy Quest</title>
<meta name="description" content="Helene's Candy Quest: walk six candy lands with Helene, collect sweets, hop the sticky spots, and bring the candy crown home. A free family game.">
<meta name="theme-color" content="#2a0d3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Candy Quest">
<meta property="og:title" content="Helene's Candy Quest">
<meta property="og:description" content="Walk six candy lands with Helene, collect sweets, and bring the candy crown home.">
<meta property="og:image" content="cover.png">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--gold:#f4c34d;--pink:#e0439a;--ink:#2a0d3a;--cream:#fff8ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
button,input{font-family:inherit}
#app{position:absolute;inset:0}
#cv{position:absolute;left:0;right:0;top:0;bottom:0;width:100%;height:100%;touch-action:none;z-index:0}
body[data-mode="play"] #cv{top:calc(72px + env(safe-area-inset-top));bottom:calc(118px + env(safe-area-inset-bottom))}
body.land[data-mode="play"] #cv,body.fine[data-mode="play"] #cv{top:calc(58px + env(safe-area-inset-top));bottom:calc(96px + env(safe-area-inset-bottom))}
#hud{display:none;position:absolute;z-index:4;left:8px;right:8px;top:calc(6px + env(safe-area-inset-top));height:58px;align-items:center;gap:6px;padding:4px 6px;border-radius:18px;background:rgba(42,13,58,.78);border:3px solid var(--gold);box-shadow:0 4px 0 #6b3a00}
body[data-mode="play"] #hud,body[data-mode="pause"] #hud{display:flex}
#hudFace{width:46px;height:46px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);flex:0 0 auto;background:#3a1860}
#hearts{font-size:20px;letter-spacing:1px;color:#ff5a93;min-width:62px;text-shadow:0 1px 0 #3a1020}
#hearts .off{color:#6d547c}
.stat{display:flex;flex-direction:column;line-height:1;min-width:0;flex:1}
.stat b{font-size:22px;color:#fff6c2}
.stat span{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#ffd0ea}
#lvlRibbon{display:none}
#btnPause{width:48px;height:48px;border-radius:16px;border:3px solid #fff;background:#6a2a98;color:#fff;font-size:22px;flex:0 0 auto}
#bubble{display:none;position:absolute;z-index:6;left:64px;top:calc(68px + env(safe-area-inset-top));max-width:min(280px,70vw);padding:8px 12px;border-radius:16px;background:#fffaf0;border:3px solid var(--gold);color:#4a1767;font-weight:800;font-size:18px;line-height:1.25;box-shadow:0 3px 0 #6b3a00}
#bubble.on{display:block}
#banner{position:absolute;z-index:6;left:50%;top:62%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:18px;background:rgba(42,13,58,.88);border:3px solid var(--gold);color:#ffe08a;font-weight:800;font-size:26px;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90vw}
#banner.on{opacity:1}
#pad{display:none;position:absolute;z-index:5;left:0;right:0;bottom:0;height:calc(112px + env(safe-area-inset-bottom));padding:8px 12px calc(10px + env(safe-area-inset-bottom));justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(transparent,rgba(28,6,40,.55) 30%)}
body[data-mode="play"] #pad{display:flex}
.cluster{display:flex;gap:10px}
#pad button{touch-action:none;border:3px solid #fff;border-radius:22px;background:rgba(90,30,130,.92);color:#fff;font-weight:900;box-shadow:0 4px 0 #3a1458}
#btnL,#btnR{width:92px;height:84px;font-size:36px}
#btnJ{width:118px;height:84px;font-size:22px;letter-spacing:.5px;background:linear-gradient(#ffe08a,#f0a020);color:#3a1600;border-color:#fff6d0;box-shadow:0 4px 0 #8a5a00;border-radius:42px}
#pad button.on{transform:translateY(2px);box-shadow:0 2px 0 #3a1458}
#btnJ.on{box-shadow:0 2px 0 #8a5a00}
body.land #pad,body.fine #pad{height:calc(96px + env(safe-area-inset-bottom));top:auto;padding:6px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(28,6,40,.4));pointer-events:none;align-items:center}
body.land #btnL,body.land #btnR,body.fine #btnL,body.fine #btnR{width:84px;height:72px}
body.land #btnJ,body.fine #btnJ{width:108px;height:72px}
body.land #pad button,body.fine #pad button{pointer-events:auto}
.scr{display:none;position:absolute;inset:0;z-index:3;overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom))}
body[data-mode="title"] #title,body[data-mode="map"] #map{display:flex}
.panel{margin:auto;width:min(520px,100%);text-align:center;background:linear-gradient(#4a1868ee,#2a0c3aee);border:4px solid var(--gold);border-radius:28px;padding:16px 16px 18px;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.hero{width:min(240px,62vw);height:auto;border-radius:22px;border:4px solid var(--gold);box-shadow:0 0 0 3px #6b3a00,0 8px 20px rgba(0,0,0,.4);object-fit:cover}
h1{font-family:Georgia,"Times New Roman",serif;font-size:42px;line-height:.95;margin:10px 0 4px;color:#ffe08a;text-shadow:3px 3px 0 #a02060}
.tag{margin:0 0 12px;font-size:18px;font-weight:700;color:#ffe0f0}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:72px;margin:8px 0 0;border-radius:18px;border:3px solid #fff;background:#6a2a98;color:#fff;font-size:26px;font-weight:900;cursor:pointer;touch-action:manipulation}
.btn small{font-size:16px;font-weight:800;opacity:.95}
.btn.gold{background:linear-gradient(#ffe08a,#e7a020);color:#3a1600;min-height:86px;font-size:32px}
.btn.teal{background:linear-gradient(#3ecf9a,#16885c)}
.btn.dim{background:#3a2a50}
.btn:active{transform:translateY(2px)}
#bSet{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:7;width:58px;height:58px;border-radius:50%;border:3px solid #fff3c4;background:rgba(60,18,80,.92);font-size:28px;display:none;align-items:center;justify-content:center;color:#fff;cursor:pointer}
body[data-mode="title"] #bSet{display:flex}
.maptop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.maptop h2{flex:1;margin:0;font-family:Georgia,serif;font-size:28px;color:#ffe08a;text-align:left}
.maptop b{color:#ffe08a;font-size:20px}
.ib{width:52px;height:52px;border-radius:16px;border:3px solid #fff;background:#6a2a98;color:#fff;font-size:22px;cursor:pointer}
#mapList{display:flex;flex-direction:column;gap:8px;text-align:left}
.mbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:68px;padding:8px 12px;border-radius:16px;border:3px solid #fff3c4;background:linear-gradient(#a24bd0,#6a1f93);color:#fff;font-size:20px;font-weight:800;cursor:pointer}
.mbtn small{color:#ffe08a;font-size:18px;letter-spacing:1px}
.mbtn.cur{outline:4px solid #3dff8a}
.mbtn.lock,.mbtn:disabled{background:#3a2a48;color:#b7a8c4;border-color:#6a5a78}
.ov{display:none;position:absolute;inset:0;z-index:8;background:rgba(10,0,16,.55);align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
.ov.on{display:flex}
.card{width:min(94vw,520px);max-height:calc(100% - 8px);overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(#4a1863,#2a0c3a);border:4px solid var(--gold);border-radius:24px;padding:14px;text-align:center}
.cbody{overflow:auto;min-height:0}
.card h2{font-family:Georgia,serif;font-size:32px;color:#ffe08a;margin:6px 0}
.card p,.card li{font-size:20px;line-height:1.35}
.card ul{text-align:left;padding-left:22px}
.card .face{width:96px;height:96px;border-radius:50%;border:4px solid var(--gold);margin:0 auto;background:url(art/face.webp) center/cover}
.card .hero{width:min(200px,50vw);margin-bottom:4px}
.stars{font-size:42px;letter-spacing:4px;color:#ffd75e}
.stars .off{color:#5c4572}
.card .btns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:22px;font-weight:800;text-align:left}
.set button{min-width:100px;height:52px;border-radius:14px;border:3px solid #fff;font-size:20px;font-weight:800;background:#4d3a5c;color:#fff}
.set button.on{background:linear-gradient(#3ddc84,#16924d)}
#dock{display:none;position:fixed;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));z-index:6;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 8px}
body[data-mode="title"] #dock{display:flex}
#dock .dk{height:48px;padding:0 14px;border-radius:24px;border:2px solid var(--gold);background:rgba(22,6,34,.92);color:#fff;font-size:18px;font-weight:800;cursor:pointer}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:50;background:rgba(22,6,34,.95);border:2px solid var(--gold);border-radius:16px;padding:8px 14px;font-size:18px;font-weight:800;display:none}
#toast.on{display:block}
body #palbCard{width:min(430px,100%);font:19px/1.35 system-ui,sans-serif}
body #palbCard h2{font-size:26px}body #palbCard .big{font-size:28px}
@media (orientation:landscape) and (max-height:500px){
  h1{font-size:32px}.hero{width:120px}.panel{padding:8px 12px}.btn{min-height:56px;font-size:22px}.btn.gold{min-height:64px;font-size:26px}
  .card h2{font-size:26px}.card p,.card li{font-size:18px}
}
@media (prefers-reduced-motion:reduce){#banner{transition:none}}
</style>
</head>
<body data-mode="title">
<div id="app">
<canvas id="cv" width="480" height="270" aria-label="Helene walking through a candy land"></canvas>
<header id="hud">
  <img id="hudFace" src="art/helene-face.png" alt="">
  <div id="hearts" aria-label="Hearts">♥♥♥</div>
  <div class="stat"><b id="score">0</b><span>score</span></div>
  <div class="stat"><b id="candy">0/0</b><span>candy</span></div>
  <button id="btnPause" type="button" aria-label="Pause">⏸</button>
</header>
<div id="lvlRibbon"></div>
<div id="bubble" role="status"></div>
<div id="banner" role="status"></div>
<div id="pad">
  <div class="cluster">
    <button id="btnL" type="button" aria-label="Walk left">◀</button>
    <button id="btnR" type="button" aria-label="Walk right">▶</button>
  </div>
  <button id="btnJ" type="button" aria-label="Jump">JUMP</button>
</div>
<section id="title" class="scr">
  <div class="panel">
    <img class="hero" src="art/helene.webp" alt="Helene, smiling, with short white hair, glasses, and a denim shirt, holding a glowing treasure chest">
    <h1>Helene's<br>Candy Quest</h1>
    <p class="tag">Six candy lands. One sweet crown.</p>
    <button id="bPlay" class="btn gold" type="button"><span>▶ PLAY</span><small id="bPlaySub">Gumdrop Meadow</small></button>
    <button id="bMap" class="btn teal" type="button">🗺️ LEVELS</button>
    <p class="tag" id="bestLine"></p>
  </div>
</section>
<section id="map" class="scr">
  <div class="panel">
    <div class="maptop">
      <button id="mapHome" class="ib" type="button" aria-label="Home">🏠</button>
      <h2>Candy Lands</h2>
      <b id="mapStars">★ 0</b>
    </div>
    <div id="mapList"></div>
  </div>
</section>
<div id="ov" class="ov" role="dialog" aria-modal="true"><div id="card" class="card"></div></div>
<button id="bSet" type="button" aria-label="Settings and how to play">⚙️</button>
<div id="dock" role="toolbar" aria-label="Share and scores">
  <button id="shareBtn" class="dk" type="button">🔗 Share</button>
  <button id="instBtn" class="dk" type="button">📲 Install</button>
</div>
<div id="toast" role="status"></div>
</div>
<script>

<script src="js/world.js?v=1"></script>
<script src="js/audio.js?v=1"></script>
<script src="js/game.js?v=1"></script>
<script src="js/gamepad.js?v=1"></script>
<script src="js/pad.js?v=1"></script>
<script src="js/palb.js?v=1"></script>
<script>
PALB.init({
  game:'helenes-candy-quest',
  title:"Helene's Candy Quest",
  order:'desc',
  unit:'pts',
  min:0,
  max:100000000,
  boards:[{id:'quest', label:'Quest'}],
  best:typeof journeyTotal==='function'?journeyTotal:null,
  muted:typeof soundMuted==='function'?soundMuted:function(){return false},
  bestDelay:4000
});
</script>
<noscript><p style="padding:16px">Helene's Candy Quest needs JavaScript.</p></noscript>
</body>
</html>
